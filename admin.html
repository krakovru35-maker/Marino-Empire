<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Marino Empire - Admin Safehouse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
<style>
:root { 
    --bg: #05080f; 
    --panel: #0d111d; 
    --accent: #ffd13b; 
    --accent-hover: #ffc107;
    --text: #ffffff; 
    --text-muted: #8b92a5; 
    --success: #00c853;
    --danger: #ff4444;
}
* { box-sizing: border-box; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* Login Screen */
#loginView {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at center, #1a2333 0%, #05080f 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
}
.login-card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 40px; border-radius: 24px;
    width: 100%; max-width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
}
.login-card h1 { font-size: 32px; font-weight: 900; margin-bottom: 10px; color: var(--accent); }
.login-card p { color: var(--text-muted); margin-bottom: 30px; font-size: 14px; }
.input-group { margin-bottom: 20px; text-align: left; }
.input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
.input-field {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    padding: 14px 18px; border-radius: 12px; color: #fff; font-size: 16px; transition: 0.3s;
}
.input-field:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.08); }
.login-btn {
    width: 100%; background: var(--accent); color: #000; border: none; padding: 16px;
    border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.3s;
    margin-top: 10px;
}
.login-btn:hover { transform: translateY(-2px); background: var(--accent-hover); box-shadow: 0 10px 20px rgba(255,209,59,0.3); }

/* Main Dashboard */
#mainView { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
.sidebar-header h2 { font-weight: 900; font-size: 24px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: var(--panel); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
.stat-card span { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
.stat-card h3 { font-size: 24px; font-weight: 900; }

.search-bar { background: var(--panel); padding: 15px 25px; border-radius: 16px; margin-bottom: 20px; display: flex; gap: 15px; border: 1px solid rgba(255,255,255,0.05); align-items: center; }
.search-bar input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; }

.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn { background: var(--panel); border: 1px solid rgba(255,255,255,0.05); color: var(--text-muted); padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; }
.tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

.content-box { background: var(--panel); border-radius: 20px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.03); }
th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
.user-row:hover { background: rgba(255,255,255,0.02); }

.badge { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.badge.pending { background: rgba(255,209,59,0.1); color: var(--accent); }
.badge.approved { background: rgba(0,200,83,0.1); color: var(--success); }
.badge.rejected { background: rgba(255,68,68,0.1); color: var(--danger); }

.action-btn { 
    background: rgba(255,255,255,0.05); border: none; color: #fff; padding: 8px 14px; 
    border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; transition: 0.2s;
    margin-right: 5px;
}
.action-btn:hover { background: rgba(255,255,255,0.1); }
.action-btn.edit { background: rgba(42, 140, 254, 0.1); color: #2A8CFE; }
.action-btn.ban { background: rgba(255, 68, 68, 0.1); color: var(--danger); }

/* Modal */
#editModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; z-index: 10000;
}
.modal-content {
    background: var(--panel); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
    width: 100%; max-width: 500px;
}
.modal-content h2 { margin-bottom: 20px; font-weight: 900; }

@media (max-width: 600px) {
    .login-card { padding: 30px 20px; }
}
</style>
</head>
<body>

  <!-- Login View -->
  <div id="loginView">
    <div class="login-card">
      <h1>SAFEHOUSE</h1>
      <p>Marino Empire Yönetim Paneline Hoş Geldiniz</p>
      
      <div class="input-group">
        <label>Yönetici Adı</label>
        <input type="text" id="adminUser" class="input-field" placeholder="Kullanıcı adı...">
      </div>
      <div class="input-group">
        <label>Parola</label>
        <input type="password" id="adminPass" class="input-field" placeholder="••••••••">
      </div>
      
      <button class="login-btn" onclick="tryLogin()">SİSTEME GİRİŞ YAP</button>
      <div id="loginMsg" style="margin-top:15px; color:var(--danger); font-size:13px; font-weight:600"></div>
    </div>
  </div>

  <!-- Main View -->
  <div id="mainView">
    <div class="sidebar-header">
      <h2>Marino <span style="color:var(--accent)">Vault</span></h2>
      <button class="action-btn" onclick="logout()">Güvenli Çıkış</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><span>Toplam Oyuncu</span><h3 id="statUsers">0</h3></div>
      <div class="stat-card"><span>Bekleyen Talepler</span><h3 id="statReqs">0</h3></div>
      <div class="stat-card"><span>Haftalık Hacim</span><h3>2.4M</h3></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="btnUsers" onclick="setMode('users')">Oyuncu Yönetimi</button>
      <button class="tab-btn" id="btnReqs" onclick="setMode('reqs')">Mağaza Talepleri</button>
    </div>

    <div id="userTools" style="margin-bottom: 20px;">
      <div class="search-bar">
        <span>🔍</span>
        <input type="text" id="userSearch" placeholder="Kullanıcı adı veya ID ile ara..." oninput="filterUsers()">
      </div>
    </div>

    <div class="content-box">
      <table id="dataTable">
        <!-- Rendered via JS -->
      </table>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div id="editModal">
    <div class="modal-content">
       <h2 id="editTitle">Kullanıcıyı Düzenle</h2>
       <div class="input-group">
         <label>Coin Bakiye</label>
         <input type="number" id="editCoin" class="input-field">
       </div>
       <div class="input-group">
         <label>Çip Bakiye</label>
         <input type="number" id="editChips" class="input-field">
       </div>
       <div class="input-group">
         <label>Prestij Seviyesi</label>
         <input type="number" id="editPrestige" class="input-field">
       </div>
       <div style="display:flex; gap:10px; margin-top:20px;">
         <button class="tab-btn" style="flex:1" onclick="closeEdit()">İptal</button>
         <button class="login-btn" style="flex:1; margin-top:0" onclick="saveUser()">Kaydet</button>
       </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://vxfjprvahjtfhvtuvsoy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SBHJItuINBdgrtXXFYZ2GQ_eVbag3KU';
const db = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY);

let allUsers = [];
let allReqs = [];
let mode = 'users'; 
let currentEditId = null;

function tryLogin() {
    const user = document.getElementById('adminUser').value;
    const pass = document.getElementById('adminPass').value;
    
    // Varsayılan giriş bilgileri
    if(user === 'admin' && pass === 'marino2026') {
        localStorage.setItem('admin_token', 'marino_authorized_2026');
        showDashboard();
    } else {
        document.getElementById('loginMsg').textContent = 'Hatalı kullanıcı adı veya parola!';
    }
}

function showDashboard() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    refreshData();
}

function logout() {
    localStorage.removeItem('admin_token');
    location.reload();
}

async function rpc(name, p) {
    const { data, error } = await db.rpc(name, p);
    if(error) { alert('Sistem Hatası: ' + error.message); throw error; }
    return data;
}

function setMode(m) {
    mode = m;
    document.getElementById('btnUsers').classList.toggle('active', m === 'users');
    document.getElementById('btnReqs').classList.toggle('active', m === 'reqs');
    document.getElementById('userTools').style.display = m === 'users' ? 'block' : 'none';
    renderTable();
}

async function refreshData() {
    try {
        allUsers = await rpc('marino_admin_get_users', { p_admin_id: '0' });
        allReqs = await rpc('marino_admin_get_requests', { p_admin_id: '0' });
        
        document.getElementById('statUsers').textContent = allUsers.length;
        document.getElementById('statReqs').textContent = allReqs.filter(r => r.status === 'pending').length;
        
        renderTable();
    } catch(e) { console.error(e); }
}

function renderTable() {
    const table = document.getElementById('dataTable');
    if(mode === 'users') {
        table.innerHTML = `
            <thead>
                <tr><th>ID / Username</th><th>Coin</th><th>Çip</th><th>Lvl / Prestige</th><th>Durum</th><th>İşlemler</th></tr>
            </thead>
            <tbody>
                ${allUsers.map(u => `
                    <tr class="user-row">
                        <td><div style="font-weight:700">${u.name}</div><div style="font-size:11px;color:var(--text-muted)">${u.id}</div></td>
                        <td>${Number(u.coin).toLocaleString()}</td>
                        <td>${Number(u.casino_chips||0).toLocaleString()}</td>
                        <td>${u.level} / ${u.prestige||0}</td>
                        <td><span class="badge ${u.banned?'rejected':'approved'}">${u.banned?'Banlı':'Aktif'}</span></td>
                        <td>
                            <button class="action-btn edit" onclick="openEdit('${u.id}')">Düzenle</button>
                            <button class="action-btn ban" onclick="toggleBan('${u.id}')">${u.banned?'Affet':'Banla'}</button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        `;
    } else {
        table.innerHTML = `
            <thead>
                <tr><th>Sıra No</th><th>Kullanıcı</th><th>İstediği Ödül</th><th>Durum</th><th>Tarih</th><th>İşlem</th></tr>
            </thead>
            <tbody>
                ${allReqs.map(r => `
                    <tr>
                        <td>#${r.req_id}</td>
                        <td><div style="font-weight:700">${r.name}</div><div style="font-size:11px;color:var(--text-muted)">${r.user_id}</div></td>
                        <td>${r.item}</td>
                        <td><span class="badge ${r.status}">${r.status === 'pending' ? 'Bekliyor' : (r.status==='approved'?'Onaylı':'Red')}</span></td>
                        <td>${new Date(r.date).toLocaleDateString()}</td>
                        <td>
                            ${r.status === 'pending' ? `
                                <button class="action-btn edit" onclick="resolveReq(${r.req_id}, 'approved')">Onayla</button>
                                <button class="action-btn ban" onclick="resolveReq(${r.req_id}, 'rejected')">Reddet</button>
                             ` : '-'}
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        `;
    }
}

function filterUsers() {
    const q = document.getElementById('userSearch').value.toLowerCase();
    const rows = document.querySelectorAll('.user-row');
    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.indexOf(q) > -1 ? '' : 'none';
    });
}

function openEdit(id) {
    const u = allUsers.find(x => x.id == id);
    if(!u) return;
    currentEditId = id;
    document.getElementById('editTitle').textContent = u.name + " Düzenleniyor";
    document.getElementById('editCoin').value = u.coin;
    document.getElementById('editChips').value = u.casino_chips || 0;
    document.getElementById('editPrestige').value = u.prestige || 0;
    document.getElementById('editModal').style.display = 'flex';
}

function closeEdit() {
    document.getElementById('editModal').style.display = 'none';
}

async function saveUser() {
    const c = document.getElementById('editCoin').value;
    const ch = document.getElementById('editChips').value;
    const pr = document.getElementById('editPrestige').value;
    
    try {
        await rpc('marino_admin_update_user', { 
            p_admin_id: '0', 
            p_target_id: currentEditId,
            p_coin: parseInt(c),
            p_chips: parseInt(ch),
            p_prestige: parseInt(pr)
        });
        alert("Başarıyla güncellendi!");
        closeEdit();
        refreshData();
    } catch(e) {}
}

async function toggleBan(id) {
    if(!confirm("Bu kullanıcının erişim yetkisini değiştirmek istediğine emin misin?")) return;
    try {
        await rpc('marino_admin_toggle_ban', { p_admin_id: '0', p_target_id: id });
        refreshData();
    } catch(e) {}
}

async function resolveReq(id, action) {
    try {
        await rpc('marino_admin_resolve_request', { p_admin_id: '0', p_req_id: id, p_action: action });
        refreshData();
    } catch(e) {}
}

if(localStorage.getItem('admin_token') === 'marino_authorized_2026') {
    showDashboard();
}

</script>
</body>
</html>
