<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Marino Empire - Admin Paneli</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0f19; --panel: #131722; --accent: #2A8CFE; --text: #fff; --text-muted: #8b92a5; }
* { box-sizing: border-box; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
.tabs { display: flex; gap: 10px; }
.tab-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 700; }
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.content { flex: 1; background: var(--panel); border-radius: 12px; padding: 20px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
th { color: var(--text-muted); font-size: 13px; text-transform: uppercase; }
tr:hover { background: rgba(255,255,255,0.02); }
.action-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; }
.action-btn.green { background: #48E085; color: #000; }
.action-btn.red { background: #ff4444; color: #fff; }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.badge.pending { background: #ffd13b; color: #000; }
.badge.approved { background: #48E085; color: #000; }
.badge.rejected { background: #ff4444; color: #fff; }
</style>
</head>
<body>
  
  <div class="header">
    <h2>👑 Admin Paneli</h2>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('users')" id="tUsers">Oyuncular</button>
      <button class="tab-btn" onclick="switchTab('reqs')" id="tReqs">Ödül Talepleri</button>
    </div>
  </div>

  <div class="content">
    <div id="vUsers">
      <table>
        <thead><tr><th>Telegam ID</th><th>Adı</th><th>Coin</th><th>Seviye</th><th>Enerji</th><th>Durum</th><th>İşlem</th></tr></thead>
        <tbody id="tbUsers"><tr><td colspan="7" style="text-align:center">Yükleniyor...</td></tr></tbody>
      </table>
    </div>

    <div id="vReqs" style="display:none">
      <table>
        <thead><tr><th>Talep ID</th><th>Kullanıcı</th><th>Ödül Kodu</th><th>Durum</th><th>Tarih</th><th>İşlem</th></tr></thead>
        <tbody id="tbReqs"></tbody>
      </table>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://vxfjprvahjtfhvtuvsoy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SBHJItuINBdgrtXXFYZ2GQ_eVbag3KU';
const db = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY);
const tg = window.Telegram?.WebApp;
const tgId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : (new URLSearchParams(location.search).has('testmode') ? '999123' : null);

async function rpc(name, p) {
  const { data, error } = await db.rpc(name, p);
  if(error) { alert('Hata: ' + error.message); throw error; }
  return data;
}

function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(t === 'users' ? 'tUsers' : 'tReqs').classList.add('active');
  document.getElementById('vUsers').style.display = t === 'users' ? 'block' : 'none';
  document.getElementById('vReqs').style.display = t === 'reqs' ? 'block' : 'none';
  if(t === 'users') loadUsers(); else loadReqs();
}

async function loadUsers() {
  try {
    const list = await rpc('marino_admin_get_users', { p_admin_id: tgId });
    document.getElementById('tbUsers').innerHTML = list.map(u => `
      <tr>
        <td>${u.id}</td><td>${u.name}</td><td>${Number(u.coin).toLocaleString()}</td><td>${u.level}</td><td>${u.energy}</td>
        <td><span class="badge ${u.banned?'rejected':'approved'}">${u.banned?'Banlı':'Aktif'}</span></td>
        <td><button class="action-btn ${u.banned?'green':'red'}" onclick="toggleBan('${u.id}')">${u.banned?'Ban Kaldır':'Banla'}</button></td>
      </tr>
    `).join('') || '<tr><td colspan="7">Oyuncu yok.</td></tr>';
  } catch(e) {}
}

async function loadReqs() {
  try {
    const list = await rpc('marino_admin_get_requests', { p_admin_id: tgId });
    document.getElementById('tbReqs').innerHTML = list.map(r => `
      <tr>
        <td>#${r.req_id}</td><td>${r.name}<br><small>${r.user_id}</small></td><td>${r.item}</td>
        <td><span class="badge ${r.status}">${r.status}</span></td><td>${new Date(r.date).toLocaleString()}</td>
        <td>
          ${r.status === 'pending' ? `
            <button class="action-btn green" onclick="resolveReq(${r.req_id}, 'approved')">Onayla</button>
            <button class="action-btn red" onclick="resolveReq(${r.req_id}, 'rejected')">Reddet</button>
          ` : '-'}
        </td>
      </tr>
    `).join('') || '<tr><td colspan="6">Talep bulunamadı.</td></tr>';
  } catch(e) {}
}

async function toggleBan(id) {
  if(!confirm("Kullanıcının ban durumunu değiştirmek istediğinize emin misiniz?")) return;
  await rpc('marino_admin_toggle_ban', { p_admin_id: tgId, p_target_id: id });
  loadUsers();
}

async function resolveReq(id, action) {
  if(!confirm("Talebi " + action + " işaretlemek istediğinize emin misiniz?")) return;
  await rpc('marino_admin_resolve_request', { p_admin_id: tgId, p_req_id: id, p_action: action });
  loadReqs();
}

if(tgId) { loadUsers(); } else { alert("Telegram ID bulunamadı."); }
</script>
</body>
</html>
