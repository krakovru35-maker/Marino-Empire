<html lang="tr">
<head>

  <header><div><span>MARINO EMPIRE</span><h1>Sosyal Moderasyon</h1></div><button id="modSignOut" type="button" hidden>Çıkış</button></header>

    <section id="modGate"><h2>Güvenli yönetici girişi</h2><p>Yetki yalnız sunucudaki operator/security_admin rolünden doğrulanır.</p><form id="modLogin"><input id="modEmail" type="email" autocomplete="email" required placeholder="Yönetici e-postası"><button type="submit">Giriş bağlantısı gönder</button></form><p id="modMessage" role="status"></p></section>
    <section id="modWorkspace" hidden><div class="mod-toolbar"><b id="modRole">ROL DOĞRULANDI</b><button id="modRefresh" type="button">Kuyruğu yenile</button></div><div id="modQueue"></div></section>
  </main>
